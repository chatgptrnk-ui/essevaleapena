<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Check icon -->
  <circle cx="180" cy="180" r="80" fill="rgba(255,255,255,0.15)" />
  <path d="M140 180 L172 212 L226 152" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Main title -->
  <text x="80" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="92" font-weight="900" fill="white" letter-spacing="-3">ESSE VALE</text>
  <text x="80" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="92" font-weight="900" fill="white" letter-spacing="-3">A PENA <tspan fill="url(#gold)">SIM</tspan></text>

  <!-- Subtitle -->
  <text x="80" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="500" fill="rgba(255,255,255,0.9)">Curadoria honesta de achados Amazon</text>
  <text x="80" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.7)">Reviews com prós E contras · @essevaleapenasim</text>
</svg>
