<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f3f4f6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  gap: 16px;
}
h2 { font-size: 14px; color: #475569; }
.story {
  width: 1080px;
  height: 1920px;
  background: linear-gradient(180deg, #1E40AF 0%, #06B6D4 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 80px 60px;
}
.story::before {
  content: "";
  position: absolute;
  top: -300px;
  right: -300px;
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(255,255,255,0.20) 0%, transparent 70%);
}
.brand {
  position: relative;
  color: white;
  font-weight: 900;
  font-size: 36px;
  letter-spacing: -1px;
  text-align: center;
  margin-bottom: 24px;
}
.label-pill {
  position: relative;
  background: rgba(255,255,255,0.18);
  color: white;
  padding: 16px 32px;
  border-radius: 100px;
  font-size: 34px;
  font-weight: 700;
  align-self: center;
  margin-bottom: 40px;
  backdrop-filter: blur(8px);
}
.title {
  position: relative;
  color: white;
  font-size: 80px;
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -2px;
  text-align: center;
  margin-bottom: 50px;
  padding: 0 20px;
}
.product-card {
  position: relative;
  background: white;
  border-radius: 32px;
  padding: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-grow: 1;
  margin-bottom: 50px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.3);
}
.product-card img {
  max-width: 100%;
  max-height: 800px;
  object-fit: contain;
}
.cta-arrow {
  position: relative;
  background: white;
  color: #1E40AF;
  padding: 36px 48px;
  border-radius: 100px;
  font-size: 48px;
  font-weight: 900;
  text-align: center;
  letter-spacing: -1px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.handle {
  position: relative;
  color: white;
  font-size: 30px;
  text-align: center;
  margin-top: 32px;
  opacity: 0.9;
  font-weight: 700;
}
.sticker-hint {
  position: absolute;
  bottom: 200px;
  right: 80px;
  background: #FBBF24;
  color: #1A1A2E;
  padding: 24px 32px;
  border-radius: 24px;
  font-size: 26px;
  font-weight: 900;
  transform: rotate(-8deg);
  box-shadow: 0 16px 40px rgba(0,0,0,0.25);
  z-index: 5;
}
</style>
</head>
<body>
<h2>📱 Story 1080×1920 — adicione o adesivo de Link apontando pra: /posts/photoage-protetor-capilar</h2>
<div class="story">
  <div class="brand">ESSE VALE A PENA SIM ✓</div>
  <div class="label-pill">💇 Novo review</div>
  <div class="title">photoage-protetor-capilar</div>
  <div class="product-card">
    <img src="https://m.media-amazon.com/images/I/61uvcE-SPvL._AC_SX679_.jpg" alt="photoage-protetor-capilar">
  </div>
  <div class="cta-arrow">👆 Adesivo de LINK aqui</div>
  <div class="handle">@essevaleapenasim</div>
  <div class="sticker-hint">VALE<br>A PENA?</div>
</div>
</body>
</html>
