<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Foto de perfil Instagram — ESSE VALE A PENA SIM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1A1A2E;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    gap: 40px;
  }
  h2 {
    color: white;
    font-size: 18px;
    margin-bottom: 8px;
    text-align: center;
  }
  .label {
    color: #94A3B8;
    font-size: 13px;
    text-align: center;
    margin-bottom: 24px;
  }
  /* Foto de perfil — versão 1080×1080 */
  .profile-pic {
    width: 1080px;
    height: 1080px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1E40AF 0%, #06B6D4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .profile-pic::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  }
  .profile-pic .logo {
    color: white;
    font-weight: 900;
    text-align: center;
    line-height: 0.85;
    letter-spacing: -16px;
    position: relative;
    z-index: 1;
  }
  .profile-pic .esse {
    font-size: 260px;
    display: block;
    margin-bottom: 30px;
  }
  .profile-pic .vale {
    font-size: 260px;
    display: block;
    margin-bottom: 30px;
  }
  .profile-pic .pena {
    font-size: 260px;
    display: block;
    margin-bottom: 30px;
  }
  .profile-pic .sim {
    font-size: 360px;
    display: block;
    background: linear-gradient(180deg, white 0%, #FBBF24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Versão alternativa minimalista */
  .profile-pic-alt {
    width: 1080px;
    height: 1080px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1E40AF 0%, #06B6D4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .profile-pic-alt::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  }
  .profile-pic-alt .initials {
    font-size: 540px;
    font-weight: 900;
    color: white;
    letter-spacing: -20px;
    line-height: 1;
    position: relative;
    z-index: 1;
  }

  /* Versão checkmark — moderno e icônico */
  .profile-pic-check {
    width: 1080px;
    height: 1080px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1E40AF 0%, #06B6D4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .profile-pic-check::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  }
  .profile-pic-check svg {
    width: 600px;
    height: 600px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 12px 40px rgba(0,0,0,0.3));
  }

  /* Versão com texto vertical compacto */
  .profile-pic-vertical {
    width: 1080px;
    height: 1080px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1E40AF 0%, #06B6D4 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
    padding: 100px;
  }
  .profile-pic-vertical::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  }
  .profile-pic-vertical .text-line {
    color: white;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -10px;
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .profile-pic-vertical .l1 { font-size: 180px; }
  .profile-pic-vertical .l2 { font-size: 180px; margin: 10px 0; }
  .profile-pic-vertical .l3 { font-size: 280px; margin-top: 30px; background: linear-gradient(180deg, white 0%, #FBBF24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
</style>
</head>
<body>

<h2>OPÇÃO 1 — Iniciais "EVP" (mais clean)</h2>
<p class="label">Recomendada: aparece bem em tamanho pequeno do Instagram</p>
<div class="profile-pic-alt">
  <span class="initials">EVP</span>
</div>

<h2>OPÇÃO 2 — Check ✓ (símbolo de "aprovado")</h2>
<p class="label">Mais icônica: símbolo de "vale a pena"</p>
<div class="profile-pic-check">
  <svg viewBox="0 0 100 100" fill="none">
    <path d="M20 52 L42 74 L82 28" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<h2>OPÇÃO 3 — Texto vertical "ESSE / VALE / SIM"</h2>
<p class="label">Mais expressiva mas pode ficar pequena no IG</p>
<div class="profile-pic-vertical">
  <div class="text-line l1">ESSE</div>
  <div class="text-line l2">VALE</div>
  <div class="text-line l3">SIM</div>
</div>

</body>
</html>
