<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="ig-post tpl-compare">
  <div class="ig-brand-strip">
    <span class="ig-logo">ESSE VALE A PENA SIM</span>
    <span class="ig-tag">Comparativo K-Beauty</span>
  </div>
  <h1>CENTELLA ou PDRN?</h1>
  <p class="sub-q">Qual ativo K-beauty escolher pra começar?</p>
  <div class="compare-grid">
    <div class="compare-card">
      <img src="https://m.media-amazon.com/images/I/51yHcK0L4UL._AC_SX679_.jpg" alt="Centella Ampoule" onerror="this.style.display='none'">
      <div>
        <div class="nome">CENTELLA</div>
        <div class="tag">Calmante · Pele reativa</div>
      </div>
    </div>
    <div class="vs-pill" style="background:linear-gradient(135deg,#BE185D 0%,#F472B6 100%);">VS</div>
    <div class="compare-card">
      <img src="https://m.media-amazon.com/images/I/61yIHcs0EkL._AC_SX679_.jpg" alt="PDRN" onerror="this.style.display='none'">
      <div>
        <div class="nome">PDRN</div>
        <div class="tag">Anti-idade · Glow</div>
      </div>
    </div>
  </div>

  <div class="ig-footer-strip">
    <span class="ig-cta">Review no link</span>
    <span class="ig-handle">@essevaleapenasim</span>
  </div>
</div>
</body>
</html>
